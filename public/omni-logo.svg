<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Central filled circle -->
  <circle cx="100" cy="105" r="22" fill="#4A9EE5"/>

  <!-- Top satellite (small ring) -->
  <circle cx="100" cy="35" r="10" stroke="#4A9EE5" stroke-width="6" fill="none"/>

  <!-- Bottom-left satellite (small ring) -->
  <circle cx="40" cy="145" r="10" stroke="#4A9EE5" stroke-width="6" fill="none"/>

  <!-- Bottom-right satellite (small ring) -->
  <circle cx="160" cy="145" r="10" stroke="#4A9EE5" stroke-width="6" fill="none"/>

  <!-- Top arc (center to top) -->
  <path d="M 82 90 Q 75 55, 92 42" stroke="#4A9EE5" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 118 90 Q 125 55, 108 42" stroke="#4A9EE5" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Left arc (center to bottom-left) -->
  <path d="M 82 112 Q 55 120, 47 138" stroke="#4A9EE5" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Right arc (center to bottom-right) -->
  <path d="M 118 112 Q 145 120, 153 138" stroke="#4A9EE5" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Bottom smile arc -->
  <path d="M 60 165 Q 100 195, 140 165" stroke="#4A9EE5" stroke-width="8" stroke-linecap="round" fill="none"/>
</svg>
